<!-- STEPUP MARKETING ENGINE — GTM Custom HTML Tag -->

<style>
#mk-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 2147483647;
  background: #111111;
  border-bottom: 2px solid #e8000d;
  padding: 9px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  flex-wrap: wrap;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}
#mk-bar .mk-stat {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.85);
  white-space: nowrap;
}
#mk-bar .mk-num {
  color: #e8000d;
  font-weight: 900;
  font-size: 14px;
  min-width: 20px;
  display: inline-block;
}
#mk-bar .mk-sep {
  width: 1px;
  height: 14px;
  background: rgba(255, 255, 255, 0.2);
}
#mk-pop {
  position: fixed;
  bottom: 90px;
  left: 16px;
  z-index: 2147483646;
  width: 280px;
  max-width: calc(100vw - 32px);
  background: #111111;
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-left: 4px solid #22c55e;
  border-radius: 12px;
  padding: 12px 32px 12px 12px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  transform: translateX(-20px);
  transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none;
  font-family: Arial, Helvetica, sans-serif;
}
#mk-pop.mk-show {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}
#mk-pop-ico {
  width: 38px;
  height: 38px;
  min-width: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, #e8000d, #ff6b6b);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
}
#mk-pop-name {
  font-size: 13px;
  font-weight: 700;
  color: #ffffff;
  margin: 0 0 2px 0;
}
#mk-pop-prod {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.5);
  margin: 0 0 2px 0;
}
#mk-pop-time {
  font-size: 10px;
  font-weight: 700;
  color: #22c55e;
  margin: 0;
}
#mk-pop-x {
  position: absolute;
  top: 7px;
  right: 8px;
  background: none;
  border: none;
  color: rgba(255, 255, 255, 0.3);
  font-size: 14px;
  cursor: pointer;
  padding: 0;
  line-height: 1;
}
</style>

<script>
(function () {

  var DAY = Math.floor(Date.now() / 86400000);
  var HOUR = new Date().getHours();

  function seeded(n, lo, hi) {
    var x = Math.sin((DAY + n) * 9301 + 49297) * 233280;
    return Math.floor((x - Math.floor(x)) * (hi - lo + 1)) + lo;
  }

  function rnd(lo, hi) {
    return Math.floor(Math.random() * (hi - lo + 1)) + lo;
  }

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  var visit  = seeded(1, 22, 54);
  var shop   = seeded(2,  5, 14);
  var orders = Math.floor(seeded(3, 45, 92) * (0.25 + Math.min(HOUR / 22, 1) * 0.75));
  var paused = false;

  var NAMES = [
    'Мария', 'Иван', 'Георги', 'Петя', 'Стефан',
    'Надя', 'Кристина', 'Димитър', 'Елена', 'Александър',
    'Виктория', 'Николай', 'Симона', 'Боян', 'Цвети',
    'Тодор', 'Даниела', 'Мартин'
  ];

  var CITIES = [
    'София', 'Пловдив', 'Варна', 'Бургас', 'Русе',
    'Стара Загора', 'Плевен', 'В. Търново', 'Благоевград',
    'Добрич', 'Шумен'
  ];

  var PRODUCTS = [
    'Nike Air Max 270', 'Jordan 1 Retro High',
    'Adidas Ultraboost 22', 'New Balance 550',
    'Nike Dunk Low', 'Puma RS-X',
    'Converse Chuck 70', 'Reebok Classic'
  ];

  var TIMES = [
    'преди 1 минута',
    'преди 2 минути',
    'преди 4 минути',
    'преди 6 минути',
    'преди 9 минути',
    'преди 12 минути'
  ];

  function setText(id, val) {
    var el = document.getElementById(id);
    if (el) { el.textContent = val; }
  }

  function build() {
    if (document.getElementById('mk-bar')) { return; }

    /* ── BAR ── */
    var bar  = document.createElement('div');
    bar.id   = 'mk-bar';

    var sp1  = document.createElement('div');
    sp1.className = 'mk-stat';
    sp1.innerHTML = '👀&nbsp;<span class="mk-num" id="mk-v">' + visit + '</span>&nbsp;на сайта сега';

    var d1   = document.createElement('div');
    d1.className = 'mk-sep';

    var sp2  = document.createElement('div');
    sp2.className = 'mk-stat';
    sp2.innerHTML = '🛒&nbsp;<span class="mk-num" id="mk-s2">' + shop + '</span>&nbsp;пазаруват';

    var d2   = document.createElement('div');
    d2.className = 'mk-sep';

    var sp3  = document.createElement('div');
    sp3.className = 'mk-stat';
    sp3.innerHTML = '📦&nbsp;<span class="mk-num" id="mk-o">' + orders + '</span>&nbsp;поръчки днес';

    bar.appendChild(sp1);
    bar.appendChild(d1);
    bar.appendChild(sp2);
    bar.appendChild(d2);
    bar.appendChild(sp3);
    document.body.appendChild(bar);

    /* ── POPUP ── */
    var pop  = document.createElement('div');
    pop.id   = 'mk-pop';

    var ico  = document.createElement('div');
    ico.id   = 'mk-pop-ico';
    ico.textContent = '💟';

    var info = document.createElement('div');

    var pName = document.createElement('p');
    pName.id  = 'mk-pop-name';

    var pProd = document.createElement('p');
    pProd.id  = 'mk-pop-prod';

    var pTime = document.createElement('p');
    pTime.id  = 'mk-pop-time';

    var btn  = document.createElement('button');
    btn.id   = 'mk-pop-x';
    btn.textContent = '✕';

    info.appendChild(pName);
    info.appendChild(pProd);
    info.appendChild(pTime);
    pop.appendChild(ico);
    pop.appendChild(info);
    pop.appendChild(btn);
    document.body.appendChild(pop);

    btn.onclick = function () {
      pop.classList.remove('mk-show');
      paused = true;
      setTimeout(function () { paused = false; }, 45000);
    };

    /* ── TICKER ── */
    setInterval(function () {
      visit  = clamp(visit  + rnd(-1, 2), 14, 68);
      shop   = clamp(shop   + rnd(-1, 1),  3, Math.min(visit - 6, 20));
      if (Math.random() < 0.18) { orders += 1; }
      setText('mk-v',  visit);
      setText('mk-s2', shop);
      setText('mk-o',  orders);
    }, rnd(5, 9) * 1000);

    /* ── POPUP LOGIC ── */
    function showPop() {
      if (paused) { return; }
      setText('mk-pop-name', pick(NAMES) + ' от ' + pick(CITIES));
      setText('mk-pop-prod', 'купи ' + pick(PRODUCTS));
      setText('mk-pop-time', pick(TIMES));
      pop.classList.add('mk-show');
      setTimeout(function () { pop.classList.remove('mk-show'); }, 5500);
    }

    function nextPop() {
      setTimeout(function () { showPop(); nextPop(); }, rnd(22, 42) * 1000);
    }

    setTimeout(function () { showPop(); nextPop(); }, rnd(10, 15) * 1000);
  }

  /* ── INIT ── */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', build);
  } else {
    build();
  }

  window.addEventListener('load', function () {
    if (!document.getElementById('mk-bar')) { build(); }
  });

}());
</script>
